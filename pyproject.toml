[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oikoumene"
version = "0.5.0"
description = "A physics-based, AI-driven simulation of human civilization on Planet Earth — JEPA agents, macro ODE, emergent geopolitics, real Earth geography."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Dr. Gerrit Tombrink" },
]
maintainers = [
    { name = "GeoLambda GmbH" },
]
keywords = [
    "agent-based-modeling",
    "climate",
    "simulation",
    "JEPA",
    "world-model",
    "AI",
    "geopolitics",
    "macroeconomics",
    "paleoclimate",
    "earth-system",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "eventlet>=0.35.0",
    "scipy>=1.12.0",
    "networkx>=3.2",
    "shapely>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
viz = [
    "matplotlib>=3.8",
    "pandas>=2.2",
]
torch = [
    "torch>=2.2",
]
data = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "pyshp>=2.3",
]
sensitivity = [
    "SALib>=1.5",
]

[project.urls]
Homepage = "https://www.geolambda.ai"
Repository = "https://github.com/GeoLambdaAI/oikoumene"
Issues = "https://github.com/GeoLambdaAI/oikoumene/issues"
Changelog = "https://github.com/GeoLambdaAI/oikoumene/blob/main/CHANGELOG.md"

[project.scripts]
oikoumene = "oikoumene.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oikoumene.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
# eventlet.monkey_patch() must run before any other import so that sockets,
# threads and time are patched; every import after it is intentionally late.
"src/oikoumene/web/app.py" = ["E402"]
# pytest.importorskip("torch") must run before the torch-dependent imports so the
# module skips cleanly when the optional backend is absent.
"tests/test_world_model_torch.py" = ["E402"]
